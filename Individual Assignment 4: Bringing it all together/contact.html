<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <img src="office-view.jpg" alt="Office View" class="header-image" />
        <div class="header-content">
          <h1>Strategy Consulting 101</h1>
          <p class="subheading">Your beginner’s guide to cracking consulting careers</p>
          <nav>
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">What is Consulting?</a></li>
              <li><a href="guide.html">How to Get In</a></li>
              <li><a href="resources.html">Resources</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </nav>
        </div>
      </header>

  <main class="container mt-5 mb-5">
    <h2>Contact Me</h2>
    <form id="contactForm" class="p-4 border rounded shadow">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Hailey Kapasi | Strategy Consulting 101</p>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Thanks for your message! I’ll get back to you soon.');
      this.reset();
    });
  </script>
</body>
</html>
